	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>

	<script>
		window.__bootProgressPct = 2;
		window.__bootProgressStatus = "正在连接服务器...";
		window.__bootProgressDetail = "初次载入将自动缓存资源，后续进入将秒开";

		window.setBootProgress = function (pct, statusText, detailText) {
			if (typeof pct === "number") {
				if (pct > (window.__bootProgressPct || 0)) {
					window.__bootProgressPct = Math.min(100, Math.max(0, Math.round(pct)));
				}
			}
			if (statusText) window.__bootProgressStatus = statusText;
			if (detailText) window.__bootProgressDetail = detailText;

			var fill = document.getElementById("boot-progress-fill");
			var pctElem = document.getElementById("boot-status-pct");
			var textElem = document.getElementById("boot-status-text");
			var detailElem = document.getElementById("boot-status-detail");

			if (fill) fill.style.width = window.__bootProgressPct + "%";
			if (pctElem) pctElem.textContent = window.__bootProgressPct + "%";
			if (textElem) textElem.textContent = window.__bootProgressStatus;
			if (detailElem) detailElem.textContent = window.__bootProgressDetail;

			if (window.__bootProgressPct >= 100) {
				window.finishBootProgress && window.finishBootProgress();
			}
		};

		window.finishBootProgress = function () {
			var loader = document.getElementById("boot-loader");
			if (!loader || loader._finished) return;
			loader._finished = true;
			if (window.__bootPollInterval) clearInterval(window.__bootPollInterval);
			if (window.__bootResourceObserver) {
				try { window.__bootResourceObserver.disconnect(); } catch (e) {}
			}
			if (document.body) {
				document.body.style.backgroundColor = "transparent";
			}
			setTimeout(function () {
				loader.style.transition = "opacity 0.4s ease-out";
				loader.style.opacity = "0";
				loader.style.pointerEvents = "none";
				setTimeout(function () {
					if (loader.parentNode) loader.parentNode.removeChild(loader);
				}, 450);
			}, 250);
		};

		(function () {
			var totalExpected = 250;
			var loaded = 0;
			var hasFinishedModules = false;

			function checkProgress() {
				if (hasFinishedModules || (window.__bootProgressPct && window.__bootProgressPct >= 48)) return;
				var current = 0;
				if (window.performance && window.performance.getEntriesByType) {
					var list = window.performance.getEntriesByType("resource");
					for (var i = 0; i < list.length; i++) {
						var name = list[i].name || "";
						if (list[i].initiatorType === "script" || name.indexOf(".js") !== -1 || name.indexOf(".css") !== -1) {
							current++;
						}
					}
				}
				if (current > loaded) {
					loaded = current;
					var pct = Math.min(48, Math.max(3, Math.round((loaded / totalExpected) * 48)));
					window.setBootProgress(
						pct,
						"正在下载核心组件 (" + Math.min(loaded, totalExpected) + "/" + totalExpected + ")...",
						"初次载入将自动缓存资源，后续进入将秒开"
					);
				}
			}

			if (window.PerformanceObserver) {
				try {
					var observer = new PerformanceObserver(function () {
						checkProgress();
					});
					observer.observe({ entryTypes: ["resource"] });
					window.__bootResourceObserver = observer;
				} catch (e) {}
			}

			window.__bootPollInterval = setInterval(checkProgress, 120);

			window.__markModulesLoaded = function () {
				hasFinishedModules = true;
				if (window.__bootPollInterval) clearInterval(window.__bootPollInterval);
				if (window.__bootResourceObserver) {
					try { window.__bootResourceObserver.disconnect(); } catch (e) {}
				}
			};

			function attachLoaderToRoot() {
				var loader = document.getElementById("boot-loader");
				if (loader && loader.parentElement !== document.documentElement) {
					document.documentElement.appendChild(loader);
				}
			}
			document.addEventListener("DOMContentLoaded", function () {
				attachLoaderToRoot();
				window.setBootProgress(window.__bootProgressPct, window.__bootProgressStatus, window.__bootProgressDetail);
			});
		})();
	</script>
